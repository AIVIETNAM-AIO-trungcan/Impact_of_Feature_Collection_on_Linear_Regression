# 1. Feature Selection (For Data Engineer)
features:
  numerical_cols:
    - "amount"
    - "area_sqft"
    - "bathroom"
    - "balcony"
    - "room_floor"
    - "total_floor"
    - "log_amount"
    - "log_area"
    - "location_freq"
  categorical_cols:
    - "location"
    - "transaction"
    - "furnishing"
    - "facing"
    - "overlooking"
    - "ownership"
    - "car_parking"
    - "area_type"

# 2. Model Parameters (For Model Engineer)
model_params:
  algorithm: "RandomForestRegressor"
  n_estimators: 100
  max_depth: 5
  random_state: 42