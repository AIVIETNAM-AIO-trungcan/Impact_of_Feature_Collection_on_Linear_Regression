# 1. Feature Selection (For Data Engineer)
features:
  numerical_cols:
    - area
    - bathroom
    - balcony
    - room_floor
    - total_floor
    - main_road_view
    - amenity_view
  categorical_cols:
    - location
    - transaction
    - furnishing
    - facing
    - ownership

# 2. Model Parameters (For Model Engineer)
model_params:
  algorithm: "RandomForestRegressor"
  n_estimators: 100
  max_depth: 5
  random_state: 42

# 3. Experiment Settings (Pipeline Branching)
experiment:
  # Target transformation mode: "raw" (no change) or "log" (np.log1p)
  target_transform: "log"
  # Target column for predictive modeling
  target_col: "amount"
  # List of input features requiring log transformation
  log_features:
    - "area"

  # Selection settings used by Feature Selection Stage in main.py
  selection_settings:
    top_k_features: 10
    criterion: "aic"
